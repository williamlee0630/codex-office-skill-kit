name: 驗收並部署辦公室技能講義

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - name: 取得專案
        uses: actions/checkout@v6
      - name: 準備 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: 安裝格式與測試套件
        run: python -m pip install -r requirements.txt
      - name: 執行完整回歸測試
        run: python tools/verify.py
      - name: 重建與驗證講義
        run: |
          python handbook/build.py
          python tools/validate_kit.py
      - name: 建立公開下載包
        run: |
          python tools/build_release.py
          python tools/check_release.py
      - name: 建立 Pages 靜態內容
        run: python tools/build_site.py
      - name: 設定 GitHub Pages
        uses: actions/configure-pages@v5
      - name: 上傳講義與下載包
        uses: actions/upload-pages-artifact@v4
        with:
          path: .work/pages-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 發布 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
